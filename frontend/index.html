<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DevMentor AI</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <h1>🤖 DevMentor AI</h1>
        <p>O teu mentor de programação</p>
      </header>

      <main class="chat">
        <div class="message mentor">
          <strong>DevMentor</strong>
          <p>Olá! 👋 Como posso ajudar nos teus estudos hoje?</p>
        </div>
      </main>

      <footer class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Escreve a tua mensagem..."
        />

        <button id="sendButton">Enviar</button>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
